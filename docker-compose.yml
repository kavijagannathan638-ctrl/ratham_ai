version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://ratham:ratham_pw@postgres:5432/ratham_db
      - JWT_SECRET=change_in_production_minimum_32_chars
    depends_on:
      - postgres
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ratham_db
      POSTGRES_USER: ratham
      POSTGRES_PASSWORD: ratham_pw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
